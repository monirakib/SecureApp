{% extends "base.html" %}
{% block title %}Edit Profile - SecureApp{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="section-title float-in">EDIT PROFILE</h2>
        <div class="card neon-card float-in float-in-delay-1">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('profile.edit_profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ g.csrf_token }}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" value="{{ profile.username }}" disabled>
                        <div class="form-text">Username is immutable</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               required value="{{ profile.email }}">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone"
                               value="{{ profile.phone }}">
                    </div>
                    <div style="border-top: 1px solid var(--glass-border); margin: 1.5rem 0; padding-top: 1rem;">
                        <h5 style="font-family: 'Orbitron', sans-serif; font-size: 0.7rem; letter-spacing: 2px; color: var(--text-muted);">CHANGE PASSWORD (OPTIONAL)</h5>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="new_password"
                               name="new_password" minlength="6" autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password"
                               name="confirm_password" autocomplete="new-password">
                    </div>
                    <div style="border-top: 1px solid var(--glass-border); margin: 1.5rem 0; padding-top: 1rem;"></div>
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Current Password <span style="color: var(--pink);">*</span></label>
                        <input type="password" class="form-control" id="current_password"
                               name="current_password" required autocomplete="current-password">
                        <div class="form-text">Required to authorize changes</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">⬡ SAVE &amp; RE-ENCRYPT</button>
                        <a href="{{ url_for('profile.view_profile') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
