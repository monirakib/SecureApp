{% extends "base.html" %}
{% block title %}Compose Message - SecureApp{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="section-title float-in">COMPOSE SECURE MESSAGE</h2>
        <div class="card neon-card float-in float-in-delay-1">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('messages.compose') }}">
                    <input type="hidden" name="csrf_token" value="{{ g.csrf_token }}">
                    <div class="mb-3">
                        <label for="recipient_id" class="form-label">Recipient</label>
                        <select class="form-select" id="recipient_id" name="recipient_id" required>
                            <option value="">Select recipient...</option>
                            {% for user in users %}
                            <option value="{{ user.id }}">{{ user.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subject" name="subject"
                               required maxlength="200" placeholder="Message subject...">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Message</label>
                        <textarea class="form-control" id="content" name="content"
                                  rows="6" required placeholder="Write your encrypted message..."></textarea>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="anonymous" name="anonymous" value="1">
                        <label class="form-check-label" for="anonymous" style="color: var(--text-secondary);">
                            Send anonymously (recipient won't see your identity)
                        </label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">⬡ ENCRYPT & SEND</button>
                        <a href="{{ url_for('messages.inbox') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="mt-3 float-in float-in-delay-2">
            <div class="encrypt-badge"><span class="dot"></span> MESSAGE WILL BE RSA ENCRYPTED AT REST</div>
        </div>
    </div>
</div>
{% endblock %}
