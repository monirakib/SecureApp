{% extends "base.html" %}
{% block title %}Submit Report - SecureApp{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="section-title float-in">SUBMIT REPORT</h2>
        <div class="card neon-card float-in float-in-delay-1">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('posts.create_post') }}" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ g.csrf_token }}">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" name="category">
                                <option value="corruption">Corruption</option>
                                <option value="fraud">Fraud</option>
                                <option value="safety">Safety Violation</option>
                                <option value="harassment">Harassment</option>
                                <option value="environmental">Environmental</option>
                                <option value="corporate">Corporate Misconduct</option>
                                <option value="government">Government</option>
                                <option value="other" selected>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="urgency" class="form-label">Urgency Level</label>
                            <select class="form-select" id="urgency" name="urgency">
                                <option value="critical">🔴 Critical</option>
                                <option value="high">🟠 High</option>
                                <option value="medium" selected>🟡 Medium</option>
                                <option value="low">🟢 Low</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title"
                               required maxlength="200" placeholder="Report title...">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Content <span id="content-count" style="color:var(--text-muted);font-size:0.78rem;float:right;">0 chars</span></label>
                        <textarea class="form-control" id="content" name="content"
                                  rows="8" required placeholder="Describe the issue in detail. Include names, dates, evidence..."
                                  oninput="document.getElementById('content-count').textContent=this.value.length+' chars'"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="document" class="form-label">Attach Document (optional, max 2MB)</label>
                        <input type="file" class="form-control" id="document" name="document">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="anonymous" name="anonymous" value="1">
                        <label class="form-check-label" for="anonymous" style="color: var(--text-secondary);">
                            Submit anonymously (a random codename will be assigned)
                        </label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">⬡ ENCRYPT &amp; SUBMIT</button>
                        <a href="{{ url_for('feed.public_feed') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="mt-3 float-in float-in-delay-2">
            <div class="encrypt-badge"><span class="dot"></span> REPORT ENCRYPTED WITH ECC ELGAMAL ON SECP256K1 · DOCUMENTS WITH AES-CTR + RSA</div>
        </div>
    </div>
</div>
{% endblock %}
