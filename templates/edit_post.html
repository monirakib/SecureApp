{% extends "base.html" %}
{% block title %}Edit Post - SecureApp{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="section-title float-in">EDIT POST</h2>
        <div class="card neon-card float-in float-in-delay-1">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('posts.edit_post', post_id=post.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ g.csrf_token }}">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title"
                               required maxlength="200" value="{{ post.title }}">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Content</label>
                        <textarea class="form-control" id="content" name="content"
                                  rows="8" required>{{ post.content }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">⬡ RE-ENCRYPT &amp; SAVE</button>
                        <a href="{{ url_for('posts.view_post', post_id=post.id) }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
